brand: true_crime
display_name: True Crime
languages: [en, tr]
formats:
  short: {aspect_ratio: "9:16", target_seconds: [30, 60]}
  long: {aspect_ratio: "16:9", target_minutes: [8, 15]}
editorial:
  promise: careful, evidence-led accounts of documented cases; never sensationalize victims
  sources: [court_records, official_statements, reputable_journalism, archival_sources]
  standards:
    - distinguish allegations, charges, convictions, appeals, and unresolved claims
    - corroborate material claims with independent sources
    - protect victims, minors, and private individuals
    - avoid graphic imagery and unsupported speculation
    - correct errors transparently
  localization: shared verified case dossier; separately written natural English and Turkish scripts
long_form:
  render_from_reusable_scenes: true
  preserve_case_timeline_and_context: true
  never_stitch_finished_shorts_with_repeated_hooks: true
publishing: {enabled: false, compliance_gate: true, human_approval: true}
