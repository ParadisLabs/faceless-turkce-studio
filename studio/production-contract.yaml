version: 1
brand: true_crime
status: development_contract
languages: [en, tr]
formats:
  shorts:
    aspect_ratio: "9:16"
    target_duration_seconds: [30, 60]
    export: "1080x1920"
  long_form:
    aspect_ratio: "16:9"
    target_duration_minutes: [8, 15]
    export: "1920x1080"
    assembly: "scene_based_continuous_narrative"
    rules:
      - "Build from reusable scene-level assets and narration, not finished Shorts."
      - "Maintain one continuous narrative arc, transitions, chapters, music bed and end credits."
      - "Create language-specific narration and on-screen text; do not machine-translate finished scripts verbatim."
editorial:
  research: "Court records and official statements first, corroborated by reputable journalism; label allegation, charge, conviction, appeal and unresolved status precisely; protect victims and minors."
  visual_identity: "Illustrated noir investigator from supplied reference sheet; non-photorealistic, non-graphic and never modeled on a real person."
  long_form_story: "Chronological case documentary with source notes, procedural context, careful uncertainty language, chapters and corrections; no sensationalized reenactments."
quality_gates:
  - "Validate script structure, factual claims and source citations."
  - "Validate every asset's provenance and commercial-use licence."
  - "Check narration timing, audio levels, subtitles and language correctness."
  - "Run ffprobe and render-quality validation for dimensions, duration, audio and codec."
  - "Run originality/repetition checks and inspect thumbnail/title for accuracy."
  - "Require human approval before any public upload."
publishing:
  youtube: disabled
  tiktok: disabled
  instagram: disabled
  drive_delivery: pending_credentials
credentials:
  required_before_live_run: true
  paid_services_must_be_explicitly_enabled: true
