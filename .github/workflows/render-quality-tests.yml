name: Render quality tests

on:
  pull_request:
    paths:
      - "pipeline.py"
      - "render_quality.py"
      - "tests/**"
      - ".github/workflows/render-quality-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "pipeline.py"
      - "render_quality.py"
      - "tests/**"
      - ".github/workflows/render-quality-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile studio renderer
        run: python -m py_compile pipeline.py render_quality.py
      - name: Run render quality tests
        run: python -m unittest discover -s tests -p "test_render_quality.py" -v
